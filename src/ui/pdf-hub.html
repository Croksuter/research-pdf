  <nav id="rpdf-strip" class="rpdf-strip" aria-label="열린 PDF">
    <button id="rpdf-project-btn" class="rpdf-project-btn" type="button" aria-haspopup="dialog" aria-expanded="false">
      <span id="rpdf-project-badge" class="rpdf-pbadge" aria-hidden="true"></span><span id="rpdf-project-name" class="rpdf-project-name"></span><svg class="rpdf-chevron"><use href="#i-chevron"/></svg>
    </button>
    <button id="rpdf-home-btn" class="rpdf-home-btn" type="button" title="홈 · 라이브러리" aria-label="홈 · 라이브러리" aria-pressed="false"><svg><use href="#i-home"/></svg></button>
    <div id="rpdf-tabs" class="rpdf-tabs" role="tablist"></div>
    <button id="rpdf-add" class="rpdf-add" type="button" title="PDF 파일 열기" aria-label="PDF 파일 열기"><svg><use href="#i-plus"/></svg></button>
    <span class="rpdf-strip-spacer"></span>
    <button id="rpdf-move-btn" class="rpdf-move-btn" type="button" title="다른 프로젝트로 이동" aria-haspopup="dialog" aria-expanded="false">
      <svg><use href="#i-move"/></svg><span>프로젝트로 이동</span>
    </button>
    <button id="rpdf-settings-btn" class="rpdf-home-btn rpdf-settings-btn" type="button" title="설정" aria-label="설정" aria-pressed="false"><svg><use href="#i-settings"/></svg></button>
    <button id="rpdf-list-btn" class="rpdf-list-btn" type="button" title="모든 탭 · 최근 닫은 탭" aria-haspopup="dialog" aria-expanded="false">
      <span id="rpdf-list-count" class="rpdf-list-count"></span><svg><use href="#i-chevron"/></svg>
    </button>
    <input id="rpdf-file-input" type="file" accept="application/pdf,.pdf" multiple hidden>
  </nav>
  <div id="rpdf-list" class="rpdf-popover" role="dialog" aria-label="모든 탭" hidden>
    <label class="rpdf-search">
      <svg aria-hidden="true"><use href="#i-search"/></svg>
      <input id="rpdf-list-search" type="search" placeholder="열린 탭 찾기" autocomplete="off" spellcheck="false">
    </label>
    <div id="rpdf-list-items" class="rpdf-list-items"></div>
  </div>
  <div id="rpdf-projects" class="rpdf-popover rpdf-popover-left" role="dialog" aria-label="프로젝트" hidden>
    <div id="rpdf-projects-items" class="rpdf-list-items"></div>
    <form id="rpdf-project-new" class="rpdf-search rpdf-new">
      <svg aria-hidden="true"><use href="#i-plus"/></svg>
      <input id="rpdf-project-new-name" type="text" maxlength="60" placeholder="새 프로젝트 — 이름 입력 후 Enter" autocomplete="off" spellcheck="false">
      <button id="rpdf-folder-new" class="rpdf-li-action" type="button" title="입력한 이름으로 새 폴더 만들기" aria-label="새 폴더 만들기"><svg><use href="#i-folder-plus"/></svg></button>
    </form>
  </div>
  <div id="rpdf-move" class="rpdf-popover" role="dialog" aria-label="프로젝트로 이동" hidden>
    <p id="rpdf-move-title" class="rpdf-pop-title"></p>
    <div id="rpdf-move-items" class="rpdf-list-items"></div>
    <form id="rpdf-move-new" class="rpdf-search rpdf-new">
      <svg aria-hidden="true"><use href="#i-plus"/></svg>
      <input id="rpdf-move-new-name" type="text" maxlength="60" placeholder="새 프로젝트로 이동 — 이름 입력 후 Enter" autocomplete="off" spellcheck="false">
    </form>
  </div>
  <div id="rpdf-style" class="rpdf-popover rpdf-popover-left rpdf-style" role="dialog" aria-label="프로젝트 아이콘" hidden>
    <div class="rpdf-style-head">
      <button id="rpdf-style-back" class="rpdf-li-action" type="button" title="프로젝트 목록으로" aria-label="프로젝트 목록으로"><svg><use href="#i-back"/></svg></button>
      <span id="rpdf-style-preview" class="rpdf-pbadge rpdf-pbadge-lg" aria-hidden="true"></span>
      <p id="rpdf-style-title" class="rpdf-style-title"></p>
    </div>
    <p class="rpdf-style-label">아이콘</p>
    <div id="rpdf-style-icons" class="rpdf-style-grid" role="listbox" aria-label="아이콘"></div>
    <p class="rpdf-style-label">이모지</p>
    <div class="rpdf-style-emoji">
      <div id="rpdf-style-emojis" class="rpdf-style-grid" role="listbox" aria-label="이모지"></div>
      <input id="rpdf-style-emoji-input" class="rpdf-style-input" type="text" maxlength="16" placeholder="다른 이모지 입력·붙여넣기" autocomplete="off" spellcheck="false">
    </div>
    <p class="rpdf-style-label">색</p>
    <div id="rpdf-style-colors" class="rpdf-style-colors" role="listbox" aria-label="색"></div>
    <div class="rpdf-style-foot">
      <button id="rpdf-style-reset" class="rpdf-style-text-btn" type="button">기본으로 (첫 글자)</button>
      <button id="rpdf-style-done" class="rpdf-primary" type="button">완료</button>
    </div>
  </div>
  <div id="rpdf-menu" class="rpdf-menu" role="menu" hidden></div>
  <main id="rpdf-frames" class="rpdf-frames">
    <section id="rpdf-home" class="rpdf-home" aria-label="홈 · 라이브러리" hidden>
      <div class="rpdf-home-inner">
        <h1 id="rpdf-home-title" class="rpdf-home-title"></h1>
        <header class="rpdf-home-head">
          <label class="rpdf-search rpdf-home-search">
            <svg aria-hidden="true"><use href="#i-search"/></svg>
            <input id="rpdf-home-search" type="search" placeholder="열었던 PDF 찾기 — 제목, 파일 이름, 주소" autocomplete="off" spellcheck="false">
          </label>
          <button id="rpdf-home-open" class="rpdf-primary" type="button">파일 열기…</button>
        </header>
        <div id="rpdf-home-sections"></div>
      </div>
    </section>
    <section id="rpdf-settings" class="rpdf-settings" aria-label="설정" hidden></section>
  </main>
  <div id="rpdf-empty" class="rpdf-empty" hidden>
    <p id="rpdf-empty-text"></p>
  </div>
  <div id="rpdf-toast" class="rpdf-toast" role="status" hidden>
    <span id="rpdf-toast-text"></span>
    <button id="rpdf-toast-action" type="button" hidden></button>
  </div>
  <script src="pdfHub.js"></script>
</body>
</html>
