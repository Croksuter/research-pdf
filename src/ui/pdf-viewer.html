<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF · ResearchPDF</title>
  <link rel="stylesheet" href="pdfjs/pdf_viewer.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="pdfViewer.css">
</head>
<body>
  <svg hidden aria-hidden="true">
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-fit-page" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 8l3-3 3 3M9 16l3 3 3-3"/></symbol>
    <symbol id="i-fit-width" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M8 9l-3 3 3 3M16 9l3 3-3 3"/></symbol>
    <symbol id="i-reparse" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.4-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.4 6.4L3 16"/><path d="M3 21v-5h5"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
    <symbol id="i-highlighter" viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 15-6.7L21 13"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M6 11l6 6 6-6M4 21h16"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></symbol>
    <symbol id="i-latex" viewBox="0 0 24 24"><path d="M17 5H7l6 7-6 7h10"/></symbol>
    <symbol id="i-capture" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></symbol>
  </svg>
  <!-- Selection ink (pdfViewer.css): under a selection, dark → blue, white stays white.
       Outside the hidden sprite: a filter in a display:none SVG does not apply. -->
  <svg class="vt-filters" width="0" height="0" aria-hidden="true" focusable="false">
    <filter id="vt-selection-ink" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.10 1"/>
        <feFuncG type="table" tableValues="0.34 1"/>
        <feFuncB type="table" tableValues="0.86 1"/>
      </feComponentTransfer>
    </filter>
  </svg>

  <header id="vocab-t-pdf-toolbar" class="vt-toolbar" role="toolbar" aria-label="PDF 도구 모음" data-i18n-aria-label="toolbar">
    <div class="vt-group vt-left">
      <button id="vt-sidebar-toggle" class="vt-btn vt-icon-btn" type="button" title="사이드바 (썸네일·목차)" aria-label="사이드바 열기/닫기" data-i18n-title="sidebarTitle" data-i18n-aria-label="sidebarAria" aria-pressed="false"><svg><use href="#i-menu"/></svg></button>
      <span class="vt-title">
        <span id="vt-file-name" class="vt-file-name" title=""></span>
        <span id="vt-paper-title" class="vt-paper-title" hidden></span>
      </span>
    </div>

    <div class="vt-group vt-center">
      <input id="vt-page" class="vt-page-input" type="number" min="1" value="1" aria-label="현재 페이지" data-i18n-aria-label="currentPage">
      <span class="vt-page-total">/ <span id="vt-page-count">–</span></span>
      <span class="vt-sep"></span>
      <button id="vt-zoom-out" class="vt-btn vt-icon-btn" type="button" title="축소 (Ctrl+-)" aria-label="축소" data-i18n-title="zoomOutTitle" data-i18n-aria-label="zoomOut"><svg><use href="#i-minus"/></svg></button>
      <select id="vt-zoom" class="vt-select" aria-label="확대/축소" data-i18n-aria-label="zoomAria">
        <option value="auto" data-i18n="zoomAuto">자동</option>
        <option value="page-fit" data-i18n="zoomPageFit">페이지 맞춤</option>
        <option value="page-width" data-i18n="zoomPageWidth">너비 맞춤</option>
        <option value="page-actual" data-i18n="zoomActual">실제 크기</option>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
        <option value="3">300%</option>
        <option value="4">400%</option>
        <option value="custom" hidden data-i18n="zoomCustom">사용자 지정</option>
      </select>
      <button id="vt-zoom-in" class="vt-btn vt-icon-btn" type="button" title="확대 (Ctrl++)" aria-label="확대" data-i18n-title="zoomInTitle" data-i18n-aria-label="zoomIn"><svg><use href="#i-plus"/></svg></button>
      <span class="vt-sep vt-sep-compact"></span>
      <button id="vt-fit-toggle" class="vt-btn vt-icon-btn" type="button" title="페이지 맞춤 / 너비 맞춤 전환" aria-label="페이지 맞춤 / 너비 맞춤 전환" data-i18n-title="fitToggle" data-i18n-aria-label="fitToggle"><svg><use href="#i-fit-page"/></svg></button>
      <button id="vt-rotate" class="vt-btn vt-icon-btn" type="button" title="시계 방향 회전 (Ctrl+])" aria-label="시계 방향 회전" data-i18n-title="rotateTitle" data-i18n-aria-label="rotate"><svg><use href="#i-rotate"/></svg></button>
      <span class="vt-sep"></span>
      <button id="vt-annotate-toggle" class="vt-btn vt-icon-btn" type="button" title="주석 달기" aria-label="주석 도구 열기/닫기" data-i18n-title="annotateTitle" data-i18n-aria-label="annotateAria" aria-pressed="false" disabled><svg><use href="#i-pen"/></svg></button>
      <button id="vt-undo" class="vt-btn vt-icon-btn" type="button" title="실행취소 (Ctrl+Z)" aria-label="실행취소" data-i18n-title="undoTitle" data-i18n-aria-label="undo" disabled><svg><use href="#i-undo"/></svg></button>
      <button id="vt-redo" class="vt-btn vt-icon-btn" type="button" title="다시실행 (Ctrl+Y)" aria-label="다시실행" data-i18n-title="redoTitle" data-i18n-aria-label="redo" disabled><svg><use href="#i-redo"/></svg></button>
      <span class="vt-sep vt-sep-compact"></span>
      <button id="vt-capture" class="vt-btn vt-icon-btn" type="button" title="그림 복사 (⌘⇧X · S · Alt+드래그)" aria-label="그림·표 영역 복사" data-i18n-aria-label="captureAria" aria-pressed="false"><svg><use href="#i-capture"/></svg></button>
      <button id="vt-latex" class="vt-btn vt-icon-btn" type="button" title="수식을 LaTeX로 복사 (L)" aria-label="수식을 LaTeX로 복사" data-i18n-title="latexTitle" data-i18n-aria-label="latexAria" aria-pressed="false"><svg><use href="#i-latex"/></svg></button>
    </div>

    <div class="vt-group vt-right">
      <button id="vt-paper-toggle" class="vt-btn vt-icon-btn" type="button" title="논문 정보 줄 펼치기/접기" aria-label="논문 정보 줄 펼치기/접기" data-i18n-title="paperToggle" data-i18n-aria-label="paperToggle" aria-pressed="false" hidden><svg><use href="#i-info"/></svg></button>
      <button id="vt-find-toggle" class="vt-btn vt-icon-btn" type="button" title="문서에서 찾기 (Ctrl+F)" aria-label="찾기" data-i18n-title="findTitle" data-i18n-aria-label="find" aria-pressed="false"><svg><use href="#i-search"/></svg></button>
      <button id="vt-download" class="vt-btn vt-icon-btn" type="button" title="다운로드 (Ctrl+S)" aria-label="다운로드" data-i18n-title="downloadTitle" data-i18n-aria-label="download"><svg><use href="#i-download"/></svg></button>
      <button id="vt-print" class="vt-btn vt-icon-btn" type="button" title="인쇄 (Ctrl+P)" aria-label="인쇄" data-i18n-title="printTitle" data-i18n-aria-label="print"><svg><use href="#i-print"/></svg></button>
      <div class="vt-menu-wrap">
        <button id="vt-more" class="vt-btn vt-icon-btn" type="button" title="더보기" aria-label="더보기 메뉴" data-i18n-title="more" data-i18n-aria-label="moreAria" aria-haspopup="menu" aria-expanded="false"><svg><use href="#i-more"/></svg></button>
        <div id="vt-menu" class="vt-menu" role="menu" hidden>
          <button type="button" role="menuitem" class="vt-menu-item vt-menu-narrow" data-menu-for="vt-download"><span data-i18n="download">다운로드</span> <kbd>Ctrl+S</kbd></button>
          <button type="button" role="menuitem" class="vt-menu-item vt-menu-narrow" data-menu-for="vt-print"><span data-i18n="print">인쇄</span> <kbd>Ctrl+P</kbd></button>
          <button type="button" role="menuitem" class="vt-menu-item vt-menu-compact" data-menu-for="vt-undo"><span data-i18n="undo">실행취소</span> <kbd>Ctrl+Z</kbd></button>
          <button type="button" role="menuitem" class="vt-menu-item vt-menu-compact" data-menu-for="vt-redo"><span data-i18n="redo">다시실행</span> <kbd>Ctrl+Y</kbd></button>
          <button type="button" role="menuitem" class="vt-menu-item vt-menu-compact" data-menu-for="vt-capture"><span data-i18n="captureMenu">그림 복사</span> <kbd>S</kbd></button>
          <button type="button" role="menuitem" class="vt-menu-item vt-menu-compact" data-menu-for="vt-latex"><span data-i18n="latexMenu">수식 → LaTeX</span> <kbd>L</kbd></button>
          <button type="button" role="menuitem" class="vt-menu-item vt-menu-compact" data-menu-for="vt-fit-toggle"><span id="vt-menu-fit-label" data-i18n="fitToPage">페이지에 맞춤</span></button>
          <button type="button" role="menuitem" class="vt-menu-item vt-menu-compact" data-menu-for="vt-rotate"><span data-i18n="rotate">시계 방향 회전</span> <kbd>Ctrl+]</kbd></button>
          <hr class="vt-menu-sep vt-menu-compact">
          <button type="button" role="menuitemcheckbox" class="vt-menu-item" id="vt-menu-two-page" aria-checked="false"><span data-i18n="twoPage">두 페이지 보기</span></button>
          <button type="button" role="menuitemcheckbox" class="vt-menu-item" id="vt-menu-annotations" aria-checked="true"><span data-i18n="showAnnotations">주석 표시</span></button>
          <button type="button" role="menuitem" class="vt-menu-item" id="vt-menu-rotate-ccw"><span data-i18n="rotateCcw">시계 반대 방향 회전</span> <kbd>Ctrl+[</kbd></button>
          <button type="button" role="menuitem" class="vt-menu-item" id="vt-menu-first"><span data-i18n="firstPage">첫 페이지</span> <kbd>Home</kbd></button>
          <button type="button" role="menuitem" class="vt-menu-item" id="vt-menu-last"><span data-i18n="lastPage">마지막 페이지</span> <kbd>End</kbd></button>
          <hr class="vt-menu-sep">
          <button type="button" role="menuitem" class="vt-menu-item" id="vt-menu-present"><span data-i18n="presentation">프레젠테이션</span></button>
          <button type="button" role="menuitem" class="vt-menu-item" id="vt-menu-properties"><span data-i18n="properties">문서 속성…</span></button>
          <hr class="vt-menu-sep">
          <button type="button" role="menuitem" class="vt-menu-item" id="vt-menu-open-file"><span data-i18n="openFile">파일 열기…</span></button>
          <button type="button" role="menuitem" class="vt-menu-item" id="vt-open-native"><span data-i18n="openNative">Chrome 기본 뷰어로 열기</span></button>
        </div>
      </div>
    </div>
  </header>

  <div id="vocab-t-pdf-paper" class="vt-paper" role="region" aria-label="논문 정보" data-i18n-aria-label="paperInfo" hidden>
    <div id="vt-paper-body" class="vt-paper-body"></div>
    <button id="vt-paper-reparse" class="vt-btn vt-icon-btn vt-paper-reparse" type="button" title="논문 정보 다시 파싱 (캐시 무시)" aria-label="논문 정보 다시 파싱" data-i18n-title="reparseTitle" data-i18n-aria-label="reparse"><svg><use href="#i-reparse"/></svg></button>
    <button id="vt-paper-close" class="vt-btn vt-icon-btn vt-paper-close" type="button" title="논문 정보 숨기기" aria-label="논문 정보 숨기기" data-i18n-title="hidePaperInfo" data-i18n-aria-label="hidePaperInfo"><svg><use href="#i-close"/></svg></button>
  </div>

  <div id="vocab-t-pdf-findbar" class="vt-findbar" role="search" hidden>
    <input id="vt-find-input" class="vt-find-input" type="search" placeholder="문서에서 찾기" aria-label="문서에서 찾기" data-i18n-placeholder="findPlaceholder" data-i18n-aria-label="findPlaceholder">
    <span id="vt-find-status" class="vt-find-status" aria-live="polite"></span>
    <button id="vt-find-prev" class="vt-btn vt-icon-btn" type="button" title="이전 결과 (Shift+Enter)" aria-label="이전 결과" data-i18n-title="findPrevTitle" data-i18n-aria-label="findPrev"><svg><use href="#i-prev"/></svg></button>
    <button id="vt-find-next" class="vt-btn vt-icon-btn" type="button" title="다음 결과 (Enter)" aria-label="다음 결과" data-i18n-title="findNextTitle" data-i18n-aria-label="findNext"><svg><use href="#i-next"/></svg></button>
    <label class="vt-find-opt"><input id="vt-find-case" type="checkbox"> <span data-i18n="matchCase">대소문자 구분</span></label>
    <label class="vt-find-opt"><input id="vt-find-word" type="checkbox"> <span data-i18n="wholeWord">단어 단위</span></label>
    <button id="vt-find-close" class="vt-btn vt-icon-btn" type="button" title="닫기 (Esc)" aria-label="찾기 닫기" data-i18n-title="closeTitle" data-i18n-aria-label="findClose"><svg><use href="#i-close"/></svg></button>
  </div>

  <div id="vocab-t-pdf-annotate-bar" class="vt-annotate-bar" role="toolbar" aria-label="주석 도구" data-i18n-aria-label="annotateBar" hidden>
    <button class="vt-btn vt-tool" type="button" data-editor-mode="9" title="형광펜" data-i18n-title="highlighter" aria-pressed="false"><svg><use href="#i-highlighter"/></svg><span data-i18n="highlighter">형광펜</span></button>
    <button class="vt-btn vt-tool" type="button" data-editor-mode="15" title="펜" data-i18n-title="pen" aria-pressed="false"><svg><use href="#i-pen"/></svg><span data-i18n="pen">펜</span></button>
    <button class="vt-btn vt-tool" type="button" data-editor-mode="3" title="텍스트" data-i18n-title="text" aria-pressed="false"><svg><use href="#i-text"/></svg><span data-i18n="text">텍스트</span></button>
    <span class="vt-sep"></span>
    <div id="vt-annotate-colors" class="vt-swatches" role="radiogroup" aria-label="색상" data-i18n-aria-label="color"></div>
    <label class="vt-range"><span data-i18n="thickness">굵기</span><input id="vt-annotate-thickness" type="range" min="1" max="24" value="4" aria-label="굵기" data-i18n-aria-label="thickness"></label>
    <label class="vt-range"><span data-i18n="opacity">투명도</span><input id="vt-annotate-opacity" type="range" min="10" max="100" value="100" aria-label="투명도" data-i18n-aria-label="opacity"></label>
    <span class="vt-sep"></span>
    <button id="vt-annotate-delete" class="vt-btn vt-icon-btn" type="button" title="선택한 주석 삭제 (Delete)" aria-label="선택한 주석 삭제" data-i18n-title="deleteSelectedTitle" data-i18n-aria-label="deleteSelected" disabled><svg><use href="#i-trash"/></svg></button>
    <span class="vt-annotate-hint" data-i18n="annotateHint">필기는 자동으로 보관·동기화되며, 다운로드하면 PDF 파일에도 함께 들어갑니다.</span>
  </div>

  <aside id="vocab-t-pdf-sidebar" class="vt-sidebar" hidden>
    <div class="vt-sidebar-tabs" role="tablist">
      <button type="button" class="vt-sidebar-tab is-active" role="tab" data-sidebar-view="thumbs" data-i18n="thumbnails">썸네일</button>
      <button type="button" class="vt-sidebar-tab" role="tab" data-sidebar-view="outline" data-i18n="outline">목차</button>
      <button type="button" class="vt-sidebar-tab" role="tab" data-sidebar-view="attachments" data-i18n="attachments">첨부파일</button>
    </div>
    <div id="vt-sidebar-thumbs" class="vt-sidebar-pane vt-thumbs"></div>
    <div id="vt-sidebar-outline" class="vt-sidebar-pane" hidden></div>
    <div id="vt-sidebar-attachments" class="vt-sidebar-pane" hidden></div>
  </aside>

  <div id="vocab-t-pdf-progress" class="vt-progress" hidden><div id="vt-progress-bar" class="vt-progress-bar"></div></div>

  <div id="viewerContainer" tabindex="0">
    <div id="viewer" class="pdfViewer"></div>
  </div>
  <div id="vocab-t-pdf-viewer-alert" class="vt-sr-only" aria-live="assertive"></div>

  <div id="vocab-t-pdf-message" class="vt-message" hidden>
    <p id="vt-message-text"></p>
    <button id="vt-message-action" class="vt-btn vt-btn-text" type="button" hidden></button>
  </div>

  <div id="vocab-t-pdf-drop" class="vt-drop" hidden><p data-i18n="dropHint">PDF 파일을 여기에 놓으면 엽니다</p></div>

  <dialog id="vocab-t-pdf-password" class="vt-dialog">
    <form method="dialog" id="vt-password-form">
      <h2 data-i18n="passwordTitle">암호로 보호된 PDF</h2>
      <p id="vt-password-hint" data-i18n="passwordPrompt">이 문서를 열려면 암호를 입력하세요.</p>
      <input id="vt-password-input" type="password" autocomplete="off" aria-label="PDF 암호" data-i18n-aria-label="passwordAria">
      <div class="vt-dialog-actions">
        <button type="button" class="vt-btn vt-btn-text" id="vt-password-cancel" data-i18n="cancel">취소</button>
        <button type="submit" class="vt-btn vt-btn-text vt-btn-primary" data-i18n="open">열기</button>
      </div>
    </form>
  </dialog>

  <dialog id="vocab-t-pdf-properties" class="vt-dialog">
    <h2 data-i18n="propertiesTitle">문서 속성</h2>
    <table class="vt-props"><tbody id="vt-props-body"></tbody></table>
    <div class="vt-dialog-actions"><button type="button" class="vt-btn vt-btn-text vt-btn-primary" id="vt-props-close" data-i18n="close">닫기</button></div>
  </dialog>

  <dialog id="vocab-t-pdf-annot-conflict" class="vt-dialog vt-conflict">
    <h2 data-i18n="conflictTitle">필기가 두 곳에 있습니다</h2>
    <p id="vt-conflict-summary"></p>
    <div id="vt-conflict-choices" class="vt-conflict-choices">
      <button type="button" class="vt-btn vt-btn-text" id="vt-conflict-file" data-i18n="keepFile">파일 필기만 유지</button>
      <button type="button" class="vt-btn vt-btn-text" id="vt-conflict-browser" data-i18n="keepBrowser">브라우저 필기만 유지</button>
      <button type="button" class="vt-btn vt-btn-text vt-btn-primary" id="vt-conflict-both" data-i18n="keepBoth">모두 유지</button>
      <button type="button" class="vt-btn vt-btn-text" id="vt-conflict-pick-open" data-i18n="pickManually">직접 선택…</button>
    </div>
    <div id="vt-conflict-pick" class="vt-conflict-pick" hidden>
      <p class="vt-conflict-hint" data-i18n="pickHint">체크한 필기만 남습니다. 항목 위에 마우스를 올리면 문서에서 위치를 보여 줍니다.</p>
      <div class="vt-conflict-columns">
        <section class="vt-conflict-col">
          <h3><span data-i18n="fileOnly">파일에만 있는 필기</span> <span id="vt-conflict-file-count"></span></h3>
          <div class="vt-conflict-tools"><button type="button" class="vt-btn vt-btn-text" id="vt-conflict-file-all" data-i18n="selectAll">전체 선택</button><button type="button" class="vt-btn vt-btn-text" id="vt-conflict-file-none" data-i18n="selectNone">전체 해제</button></div>
          <ul id="vt-conflict-file-list" class="vt-conflict-list"></ul>
        </section>
        <section class="vt-conflict-col">
          <h3><span data-i18n="browserOnly">브라우저에만 있는 필기</span> <span id="vt-conflict-cache-count"></span></h3>
          <div class="vt-conflict-tools"><button type="button" class="vt-btn vt-btn-text" id="vt-conflict-cache-all" data-i18n="selectAll">전체 선택</button><button type="button" class="vt-btn vt-btn-text" id="vt-conflict-cache-none" data-i18n="selectNone">전체 해제</button></div>
          <ul id="vt-conflict-cache-list" class="vt-conflict-list"></ul>
        </section>
      </div>
      <div class="vt-dialog-actions">
        <button type="button" class="vt-btn vt-btn-text" id="vt-conflict-pick-back" data-i18n="back">뒤로</button>
        <button type="button" class="vt-btn vt-btn-text vt-btn-primary" id="vt-conflict-pick-apply" data-i18n="keepSelected">선택한 필기만 유지</button>
      </div>
    </div>
  </dialog>

  <div id="vocab-t-pdf-print-progress" class="vt-print-progress" hidden>
    <span id="vt-print-progress-text" data-i18n="printPreparing">인쇄 준비 중…</span>
    <progress id="vt-print-progress-bar" max="1" value="0"></progress>
    <button id="vt-print-cancel" class="vt-btn vt-btn-text" type="button" data-i18n="cancel">취소</button>
  </div>
  <div id="vocab-t-pdf-print" class="vt-print-sheets" aria-hidden="true"></div>
  <input id="vt-open-file-input" type="file" accept="application/pdf,.pdf" hidden>

  <script src="pdfViewer.js"></script>
</body>
</html>
